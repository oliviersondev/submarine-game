name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - name: Check out clean source
        uses: actions/checkout@v4

      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Native checks
        run: cargo check --locked -p shared -p simulation -p server
